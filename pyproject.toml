[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-judge-eval"
version = "0.1.0"
description = "Compare human eval, LLM-as-judge, and automatic metrics on NLP tasks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Marzieh Babaali" }]
keywords = ["nlp", "evaluation", "llm-as-judge", "metrics", "human-eval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
dev = ["pytest>=7.0.0", "openai>=1.0.0"]

[project.scripts]
llm-judge-eval = "llm_judge_eval.cli:main"

[project.urls]
Homepage = "https://github.com/mahsamb/llm-judge-eval-framework"
Repository = "https://github.com/mahsamb/llm-judge-eval-framework"
Issues = "https://github.com/mahsamb/llm-judge-eval-framework/issues"

[tool.setuptools.packages.find]
include = ["llm_judge_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
